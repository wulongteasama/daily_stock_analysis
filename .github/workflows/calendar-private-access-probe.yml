name: Calendar V1.13.5 executor output

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-output:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch validated output
        env:
          BASE_URL: https://agent-v1135-cloudflare-executor-20260804-private-finance-calendar.q619820895.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            scode=$(curl -L -sS -o status.json -w '%{http_code}' "$BASE_URL/recovery/status.json" || true)
            zcode=$(curl -L -sS -o private-finance-calendar-updated.zip -w '%{http_code}' "$BASE_URL/recovery/private-finance-calendar-updated.zip" || true)
            if [ "$scode" = "200" ] && python3 -m json.tool status.json >/dev/null 2>&1 && [ "$zcode" = "200" ] && unzip -t private-finance-calendar-updated.zip >/dev/null 2>&1; then
              cat status.json
              exit 0
            fi
            echo "executor output not ready (status=$scode zip=$zcode), attempt $attempt"
            rm -f status.json private-finance-calendar-updated.zip
            sleep 10
          done
          exit 2
      - name: Upload validated output
        uses: actions/upload-artifact@v4
        with:
          name: private-finance-calendar-v1135-output
          path: |
            status.json
            private-finance-calendar-updated.zip
          if-no-files-found: error
          retention-days: 1
