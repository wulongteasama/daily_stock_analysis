name: Calendar private access probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test existing repository credentials safely
        env:
          TOKEN_GH_PAT: ${{ secrets.GH_PAT }}
          TOKEN_PAT: ${{ secrets.PAT }}
          TOKEN_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          TOKEN_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TOKEN_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TOKEN_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOKEN_REPO_PAT: ${{ secrets.REPO_PAT }}
          TOKEN_CODEX_PAT: ${{ secrets.CODEX_PAT }}
          TOKEN_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          TOKEN_DEFAULT: ${{ github.token }}
        run: |
          set +x
          python3 - <<'PY'
          import os, subprocess
          target='https://github.com/wulongteasama/private-finance-calendar.git'
          names=[k for k in os.environ if k.startswith('TOKEN_')]
          working=[]
          for name in names:
              token=os.environ.get(name,'')
              if not token:
                  print(f'{name}=unset')
                  continue
              url=target.replace('https://',f'https://x-access-token:{token}@')
              p=subprocess.run(['git','ls-remote','--heads',url,'main'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              ok=p.returncode==0
              print(f'{name}=' + ('works' if ok else 'no_access'))
              if ok: working.append(name)
          print('WORKING_CREDENTIALS=' + ','.join(working))
          raise SystemExit(0 if working else 3)
          PY
