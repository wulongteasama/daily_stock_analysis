name: Calendar branch snapshot fetch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fetch-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch branch recovery snapshot
        env:
          SNAPSHOT_URL: https://agent-ai-software-pltr-ddog-20260804-private-finance-calendar.q619820895.workers.dev/recovery/private-finance-calendar-snapshot.zip
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            code=$(curl -L -sS -o private-finance-calendar-snapshot.zip -w '%{http_code}' "$SNAPSHOT_URL" || true)
            if [ "$code" = "200" ] && unzip -t private-finance-calendar-snapshot.zip >/dev/null 2>&1; then
              echo "snapshot fetched on attempt $attempt"
              unzip -l private-finance-calendar-snapshot.zip | tail -n 5
              exit 0
            fi
            echo "snapshot not ready (HTTP $code), attempt $attempt"
            rm -f private-finance-calendar-snapshot.zip
            sleep 10
          done
          exit 2
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: private-finance-calendar-snapshot
          path: private-finance-calendar-snapshot.zip
          if-no-files-found: error
          retention-days: 1
